3e\u003cspan class=\"h-sr-only\"\u003e \u003c/span\u003e\u003cbr aria-hidden=\"true\"\u003e\u003c/p\u003e\u003cp\u003e\u003cb\u003eEveryday Essentials Kids Will Love\u003c/b\u003e\u003c/p\u003e\u003cp\u003e\u003cspan class=\"h-sr-only\"\u003e \u003c/span\u003e\u003cbr aria-hidden=\"true\"\u003e\u003c/p\u003e\u003cp\u003eComfort is key when it comes to children\u0026#8217;s clothing. Our selection features soft fabrics, tag-free labels, adjustable waists, and kid-friendly closures for stress-free dressing. Shop warm-weather essentials like short sleeve shirts and shorts, or layer up with hoodies and jackets for cooler months. Our versatile kids\u0026#8217; clothing makes creating outfits simple and fun.\u003c/p\u003e\u003cp\u003e\u003cspan class=\"h-sr-only\"\u003e \u003c/span\u003e\u003cbr aria-hidden=\"true\"\u003e\u003c/p\u003e\u003cp\u003eAnd because life with kids can be messy, most of our clothes are machine-washable, shrink-resistant, and built to last—so you can spend less time worrying and more time enjoying every adventure.\u003c/p\u003e\u003cp\u003e\u003cspan class=\"h-sr-only\"\u003e \u003c/span\u003e\u003cbr aria-hidden=\"true\"\u003e\u003c/p\u003e\u003cp\u003e\u003cb\u003eSchool Uniforms That Make the Grade\u003c/b\u003e\u003c/p\u003e\u003cp\u003e\u003cspan class=\"h-sr-only\"\u003e \u003c/span\u003e\u003cbr aria-hidden=\"true\"\u003e\u003c/p\u003e\u003cp\u003eGet ready for back-to-school with our school uniform collection. Choose from classic polos, button-down shirts, pleated skirts, and stretch-cotton pants in traditional school colors. Features like reinforced knees and wrinkle-resistant fabrics keep uniforms looking sharp all year long. Our school-approved uniform options offer comfort, fit, and durability parents can trust.\u003c/p\u003e\u003cp\u003e\u003cspan class=\"h-sr-only\"\u003e \u003c/span\u003e\u003cbr aria-hidden=\"true\"\u003e\u003c/p\u003e\u003cp\u003e\u003cb\u003eBaby Clothes That Make Life Easier\u003c/b\u003e\u003c/p\u003e\u003cp\u003e\u003cspan class=\"h-sr-only\"\u003e \u003c/span\u003e\u003cbr aria-hidden=\"true\"\u003e\u003c/p\u003e\u003cp\u003eOur baby clothes are made from ultra-soft cotton with easy snap closures and extra room for growth, making changes and outings simple. Choose from cute prints, gender-neutral basics, and cozy sets perfect for gifting or everyday wear.\u003c/p\u003e\u003cp\u003e\u003cspan class=\"h-sr-only\"\u003e \u003c/span\u003e\u003cbr aria-hidden=\"true\"\u003e\u003c/p\u003e\u003cp\u003e\u003cb\u003eBuilt for Active Kids and Busy Parents\u003c/b\u003e\u003c/p\u003e\u003cp\u003e\u003cspan class=\"h-sr-only\"\u003e \u003c/span\u003e\u003cbr aria-hidden=\"true\"\u003e\u003c/p\u003e\u003cp\u003eFrom babies to toddlers and big kids, our children\u0026#8217;s clothing is thoughtfully designed to move with your child\u0026#8217;s active lifestyle. Whether it\u0026#8217;s running, jumping, or exploring, our clothes keep up without holding them back. Find sizes for every age and stage—all in one convenient place.\u003c/p\u003e\u003cp\u003e\u003cspan class=\"h-sr-only\"\u003e \u003c/span\u003e\u003cbr aria-hidden=\"true\"\u003e\u003c/p\u003e\u003cp\u003e\u003cb\u003eFAQs\u003c/b\u003e\u003c/p\u003e\u003cp\u003e\u003cspan class=\"h-sr-only\"\u003e \u003c/span\u003e\u003cbr aria-hidden=\"true\"\u003e\u003c/p\u003e\u003cp\u003eQ: Do you offer clothing for school uniforms?\u003c/p\u003e\u003cp\u003e\u003cspan class=\"h-sr-only\"\u003e \u003c/span\u003e\u003cbr aria-hidden=\"true\"\u003e\u003c/p\u003e\u003cp\u003eA: Yes! Our school uniform collection includes polos, pants, skirts, and short sleeve tops that meet most school dress codes and are made for comfort and durability.\u003c/p\u003e\u003cp\u003e\u003cspan class=\"h-sr-only\"\u003e \u003c/span\u003e\u003cbr aria-hidden=\"true\"\u003e\u003c/p\u003e\u003cp\u003eQ: Are your kids\u0026#8217; clothes machine washable?\u003c/p\u003e\u003cp\u003e\u003cspan class=\"h-sr-only\"\u003e \u003c/span\u003e\u003cbr aria-hidden=\"true\"\u003e\u003c/p\u003e\u003cp\u003eA: Absolutely. Most of our kids\u0026#8217; clothing—including baby clothes—is machine washable and made to resist shrinking, fading, and stains. Perfect for busy families.\u003c/p\u003e\u003cp\u003e\u003cspan class=\"h-sr-only\"\u003e \u003c/span\u003e\u003cbr aria-hidden=\"true\"\u003e\u003c/p\u003e\u003cp\u003eQ: What should I buy for back-to-school season?\u003c/p\u003e\u003cp\u003e\u003cspan class=\"h-sr-only\"\u003e \u003c/span\u003e\u003cbr aria-hidden=\"true\"\u003e\u003c/p\u003e\u003cp\u003eA: For back-to-school, we recommend picking up essentials like short sleeve polos or tees, uniform bottoms, outerwear, and versatile pieces that mix and match throughout the week.\u003c/p\u003e\u003cp\u003e\u003cspan class=\"h-sr-only\"\u003e \u003c/span\u003e\u003cbr aria-hidden=\"true\"\u003e\u003c/p\u003e\u003cp\u003eExplore our collection of kids\u0026#8217; clothing today to discover quality, style, and everyday value in one place. From baby outfits to back-to-school uniforms, it\u0026#8217;s easy to dress kids for every adventure and every milestone.\u003c/p\u003e\u003cp\u003e\u003cspan class=\"h-sr-only\"\u003e \u003c/span\u003e\u003cbr aria-hidden=\"true\"\u003e\u003c/p\u003e"},"presentation":"/adaptive/c_web_a_0029/v01/mobile","order":2600}},"uri":"/xcoz4/WEB","deactivation_date":"2026-10-11T07:00Z","activation_date":"2026-10-04T07:00Z"},"metadata":{"status":200,"cacheDirectives":{"s-maxage":300},"x-api-id":"5b42a495-bd87-406c-a884-383c65d20cdc"}},"dataUpdateCount":1,"dataUpdatedAt":1791344201206,"error":null,"errorUpdateCount":0,"errorUpdatedAt":0,"fetchFailureCount":0,"fetchFailureReason":null,"fetchMeta":null,"isInvalidated":false,"status":"success","fetchStatus":"idle"},"queryKey":["@web/domain-content/get-page-content",{"breadcrumbs":true,"children":true,"url":"/c/-/N-xcoz4","visitor_id":"01A1146F4D8002009EC38C4864C0FB34","experimentHeaders":{},"platform":"desktop"}],"queryHash":"[\"@web/domain-content/get-page-content\",{\" ts and school uniforms, our kids\u0026#8217; apparel delivers on quality, value, and fun.\u003c/p\u003e\u003cp\u003e\u003cspan class=\"h-sr-only\"\u003e \u003c/span\u003e\u003cbr aria-hidden=\"true\"\u003e\u003c/p\u003e\u003cp\u003eWhether you\u0026#8217;re shopping for playtime, picture day, or back-to-school, we\u0026#8217;ve got you covered with clothing that moves with your child, stands up to everyday wear and tear, and looks great from morning to night. Discover soft t-shirts, breathable tops, comfy leggings, durable jeans, and cozy layers—each crafted for all-day comfort and easy mix-and-match outfits.\u003c/p\u003e\u003cp\u003e\u003cspan class=\"h-sr-only\"\u003e \u003c/span\u003e\u003cbr aria-hidden=\"true\"\u003e\u003c/p\u003e\u003cp\u003e\u003cb\u003eEveryday Essentials Kids Will Love\u003c/b\u003e\u003c/p\u003e\u003cp\u003e\u003cspan class=\"h-sr-only\"\u003e \u003c/span\u003e\u003cbr aria-hidden=\"true\"\u003e\u003c/p\u003e\u003cp\u003eComfort is key when it comes to children\u0026#8217;s clothing. Our selection features soft fabrics, tag-free labels, adjustable waists, and kid-friendly closures for stress-free dressing. Shop warm-weather essentials like short sleeve shirts and shorts, or layer up with hoodies and jackets for cooler months. Our versatile kids\u0026#8217; clothing makes creating outfits simple and fun.\u003c/p\u003e\u003cp\u003e\u003cspan class=\"h-sr-only\"\u003e \u003c/span\u003e\u003cbr aria-hidden=\"true\"\u003e\u003c/p\u003e\u003cp\u003eAnd because life with kids can be messy, most of our clothes are machine-washable, shrink-resistant, and built to last—so you can spend less time worrying and more time enjoying every adventure.\u003c/p\u003e\u003cp\u003e\u003cspan class=\"h-sr-only\"\u003e \u003c/span\u003e\u003cbr aria-hidden=\"true\"\u003e\u003c/p\u003e\u003cp\u003e\u003cb\u003eSchool Uniforms That Make the Grade\u003c/b\u003e\u003c/p\u003e\u003cp\u003e\u003cspan class=\"h-sr-only\"\u003e \u003c/span\u003e\u003cbr aria-hidden=\"true\"\u003e\u003c/p\u003e\u003cp\u003eGet ready for back-to-school with our school uniform collection. Choose from classic polos, button-down shirts, pleated skirts, and stretch-cotton pants in traditional school colors. Features like reinforced knees and wrinkle-resistant fabrics keep uniforms looking sharp all year long. Our school-approved uniform options offer comfort, fit, and durability parents can trust.\u003c/p\u003e\u003cp\u003e\u003cspan class=\"h-sr-only\"\u003e \u003c/span\u003e\u003cbr aria-hidden=\"true\"\u003e\u003c/p\u003e\u003cp\u003e\u003cb\u003eBaby Clothes That Make Life Easier\u003c/b\u003e\u003c/p\u003e\u003cp\u003e\u003cspan class=\"h-sr-only\"\u003e \u003c/span\u003e\u003cbr aria-hidden=\"true\"\u003e\u003c/p\u003e\u003cp\u003eOur baby clothes are made from ultra-soft cotton with easy snap closures and extra room for growth, making changes and outings simple. Choose from cute prints, gender-neutral basics, and cozy sets perfect for gifting or everyday wear.\u003c/p\u003e\u003cp\u003e\u003cspan class=\"h-sr-only\"\u003e \u003c/span\u003e\u003cbr aria-hidden=\"true\"\u003e\u003c/p\u003e\u003cp\u003e\u003cb\u003eBuilt for Active Kids and Busy Parents\u003c/b\u003e\u003c/p\u003e\u003cp\u003e\u003cspan class=\"h-sr-only\"\u003e \u003c/span\u003e\u003cbr aria-hidden=\"true\"\u003e\u003c/p\u003e\u003cp\u003eFrom babies to toddlers and big kids, our children\u0026#8217;s clothing is thoughtfully designed to move with your child\u0026#8217;s active lifestyle. Whether it\u0026#8217;s running, jumping, or exploring, our clothes keep up without holding them back. Find sizes for every age and stage—all in one convenient place.\u003c/p\u003e\u003cp\u003e\u003cspan class=\"h-sr-only\"\u003e \u003c/span\u003e\u003cbr aria-hidden=\"true\"\u003e\u003c/p\u003e\u003cp\u003e\u003cb\u003eFAQs\u003c/b\u003e\u003c/p\u003e\u003cp\u003e\u003cspan class=\"h-sr-only\"\u003e \u003c/span\u003e\u003cbr aria-hidden=\"true\"\u003e\u003c/p\u003e\u003cp\u003eQ: Do you offer clothing for school uniforms?\u003c/p\u003e\u003cp\u003e\u003cspan class=\"h-sr-only\"\u003e \u003c/span\u003e\u003cbr aria-hidden=\"true\"\u003e\u003c/p\u003e\u003cp\u003eA: Yes! Our school uniform collection includes polos, pants, skirts, and short sleeve tops that meet most school dress codes and are made for comfort and durability.\u003c/p\u003e\u003cp\u003e\u003cspan class=\"h-sr-only\"\u003e \u003c/span\u003e\u003cbr aria-hidden=\"true\"\u003e\u003c/p\u003e\u003cp\u003eQ: Are your kids\u0026#8217; clothes machine washable?\u003c/p\u003e\u003cp\u003e\u003cspan class=\"h-sr-only\"\u003e \u003c/span\u003e\u003cbr aria-hidden=\"true\"\u003e\u003c/p\u003e\u003cp\u003eA: Absolutely. Most of our kids\u0026#8217; clothing—including baby clothes—is machine washable and made to resist shrinking, fading, and stains. Perfect for busy families.\u003c/p\u003e\u003cp\u003e\u003cspan class=\"h-sr-only\"\u003e \u003c/span\u003e\u003cbr aria-hidden=\"true\"\u003e\u003c/p\u003e\u003cp\u003eQ: What should I buy for back-to-school season?\u003c/p\u003e\u003cp\u003e\u003cspan class=\"h-sr-only\"\u003e \u003c/span\u003e\u003cbr aria-hidden=\"true\"\u003e\u003c/p\u003e\u003cp\u003eA: For back-to-school, we recommend picking up essentials like short sleeve polos or tees, uniform bottoms, outerwear, and versatile pieces that mix and match throughout the week.\u003c/p\u003e\u003cp\u003e\u003cspan class=\"h-sr-only\"\u003e \u003c/span\u003e\u003cbr aria-hidden=\"true\"\u003e\u003c/p\u003e\u003cp\u003eExplore our collection of kids\u0026#8217; clothing today to discover quality, style, and everyday value in one place. From baby outfits to back-to-school uniforms, it\u0026#8217;s easy to dress kids for every adventure and every milestone.\u003c/p\u003e\u003cp\u003e\u003cspan class=\"h-sr-only\"\u003e \u003c/span\u003e\u003cbr aria-hidden=\"true\"\u003e\u003c/p\u003e","metadata":{"component_type":"SEO","component_version":"01"}},"presentation":"/adaptive/c_web_a_0029/v01/mobile","extensions":[
