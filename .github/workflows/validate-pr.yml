name: Validate Concierge PR

on:
  push:
    branches:
      - fix/launch-readiness-audit
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint changed launch-readiness files
        run: >
          npx eslint --quiet
          src/pages/ProductDetail.jsx
          src/pages/TryOn.jsx
          src/pages/Wishlist.jsx
          src/pages/Profile.jsx
          src/pages/Cart.jsx
          src/pages/Checkout.jsx
          src/components/instore/InStoreCheckout.jsx
          src/components/DeleteAccountDialog.jsx
