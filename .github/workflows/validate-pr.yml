name: Validate Concierge PR

on:
  push:
    branches:
      - main
      - hardening/full-platform-pass
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  # Release gate validates the migrated Supabase runtime.
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Reject Base44 runtime imports
        run: |
          if grep -R -n -E "from ['\"]@?base44|from ['\"]base44|require\(['\"]@?base44|require\(['\"]base44" src --exclude-dir=node_modules; then
            echo "Base44 runtime import found in src"
            exit 1
          fi
      - name: Build
        run: npm run build
      - name: Lint application
        run: npm run lint
